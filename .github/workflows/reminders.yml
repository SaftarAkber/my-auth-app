# Aylıq sınaq xatırlatmaları (3 saat və 1 saat 20 dəqiqə qalmış telefon bildirişi).
# Vercel-in pulsuz planı cron-u gündə 1 dəfə icazə verir, ona görə hər 10 dəqiqədən bir GitHub çağırır.
# Heç bir açar/secret lazım deyil: sayt yalnız vaxtı çatmış xatırlatmaları bir dəfə göndərir.
name: Aylıq sınaq xatırlatmaları

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Xatırlatmaları göndər
        run: curl -fsS --max-time 60 "https://my-auth-app-ivory.vercel.app/api/cron/reminders"
